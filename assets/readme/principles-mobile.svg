<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1012" viewBox="0 0 420 1012" role="img" aria-label="Principles: How I build">
<title>Principles: How I build</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="420" height="1012" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="420" height="1012" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="420" height="1012" fill="#FFFFFF"/>
<rect width="420" height="1012" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="1011" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="26" y="26" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="54" y="32" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="54">PRINCIPLES</tspan></text><text x="26" y="72" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="26">How I build</tspan></text><rect x="26" y="101.2" width="368" height="130.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="133.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">01</tspan></text><line x1="72" y1="129.2" x2="92" y2="129.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="161.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Own the outcome</tspan></text><text x="46" y="188" font-size="14" fill="#475569"><tspan x="46">Accountability continues past the merge: rollout,</tspan><tspan x="46" dy="21.5">monitoring, and on-call.</tspan></text><rect x="26" y="247.7" width="368" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="279.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">02</tspan></text><line x1="72" y1="275.7" x2="92" y2="275.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="307.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Design for failure</tspan></text><text x="46" y="334.5" font-size="14" fill="#475569"><tspan x="46">Expect duplicate messages, slow</tspan><tspan x="46" dy="21.5">dependencies, and partial outages, then make</tspan><tspan x="46" dy="21.5">them uneventful.</tspan></text><rect x="26" y="415.7" width="368" height="130.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="447.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">03</tspan></text><line x1="72" y1="443.7" x2="92" y2="443.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="475.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Measure first</tspan></text><text x="46" y="502.5" font-size="14" fill="#475569"><tspan x="46">Traces, p95 latency, and error budgets guide</tspan><tspan x="46" dy="21.5">decisions, not intuition.</tspan></text><rect x="26" y="562.2" width="368" height="130.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="594.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">04</tspan></text><line x1="72" y1="590.2" x2="92" y2="590.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="622.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Ground AI in evidence</tspan></text><text x="46" y="649" font-size="14" fill="#475569"><tspan x="46">Retrieval with sources, versioned datasets, and</tspan><tspan x="46" dy="21.5">regression evals before anything ships.</tspan></text><rect x="26" y="708.7" width="368" height="130.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="740.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">05</tspan></text><line x1="72" y1="736.7" x2="92" y2="736.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="768.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Earn complexity</tspan></text><text x="46" y="795.5" font-size="14" fill="#475569"><tspan x="46">Start with the simplest design that works. Add</tspan><tspan x="46" dy="21.5">complexity only when the data demands it.</tspan></text><rect x="26" y="855.2" width="368" height="130.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="46" y="887.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="46">06</tspan></text><line x1="72" y1="883.2" x2="92" y2="883.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="46" y="915.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="46">Multiply the team</tspan></text><text x="46" y="942" font-size="14" fill="#475569"><tspan x="46">Clear docs, thoughtful reviews, and mentoring</tspan><tspan x="46" dy="21.5">are part of the deliverable.</tspan></text>
</g>
</svg>
