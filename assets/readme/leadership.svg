<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-label="Leadership: From owning systems to growing engineers">
<title>Leadership: From owning systems to growing engineers</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="880" height="490" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="880" height="490" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="880" height="490" fill="#FFFFFF"/>
<rect width="880" height="490" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="879" height="489" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="44" y="44" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="72" y="50" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="72">LEADERSHIP</tspan></text><text x="44" y="90" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="44">From owning systems to growing engineers</tspan></text><text x="44" y="128.7" font-size="15.5" fill="#334155"><tspan x="44">The next stage of my growth is multiplying impact through others. I'm deliberately building the skills of an</tspan><tspan x="44" dy="26">engineering leader while staying close to the code.</tspan></text><rect x="44" y="181.35" width="388" height="263.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="66" y="218.35" font-size="15.5" fill="#0F172A" font-weight="700"><tspan x="66">What I do today</tspan></text><g transform="translate(66 237.05) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="93" y="250.35" font-size="14" fill="#334155"><tspan x="93">Mentor engineers through pairing, design</tspan><tspan x="93" dy="21.5">feedback, and code reviews that teach</tspan></text><g transform="translate(66 286.75) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="93" y="300.05" font-size="14" fill="#334155"><tspan x="93">Lead system design reviews and drive</tspan><tspan x="93" dy="21.5">alignment on technical tradeoffs</tspan></text><g transform="translate(66 336.45) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="93" y="349.75" font-size="14" fill="#334155"><tspan x="93">Own operational readiness and incident</tspan><tspan x="93" dy="21.5">response for the services I build</tspan></text><g transform="translate(66 386.15) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="93" y="399.45" font-size="14" fill="#334155"><tspan x="93">Partner with ML engineers on performance,</tspan><tspan x="93" dy="21.5">quality, and release confidence</tspan></text><rect x="448" y="181.35" width="388" height="263.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="470" y="218.35" font-size="15.5" fill="#0F172A" font-weight="700"><tspan x="470">What I'm building toward</tspan></text><g transform="translate(470 237.05) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="497" y="250.35" font-size="14" fill="#334155"><tspan x="497">Setting technical direction and a roadmap a</tspan><tspan x="497" dy="21.5">team can rally behind</tspan></text><g transform="translate(470 286.75) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="497" y="300.05" font-size="14" fill="#334155"><tspan x="497">Growing engineers into owners through</tspan><tspan x="497" dy="21.5">coaching and candid feedback</tspan></text><g transform="translate(470 336.45) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="497" y="349.75" font-size="14" fill="#334155"><tspan x="497">Building a culture of clarity, focus, and shared</tspan><tspan x="497" dy="21.5">credit</tspan></text>
</g>
</svg>
