<svg xmlns="http://www.w3.org/2000/svg" width="420" height="761" viewBox="0 0 420 761" role="img" aria-label="Leadership: From owning systems to growing engineers">
<title>Leadership: From owning systems to growing engineers</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="420" height="761" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="420" height="761" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="420" height="761" fill="#FFFFFF"/>
<rect width="420" height="761" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="760" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="26" y="26" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="54" y="32" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="54">LEADERSHIP</tspan></text><text x="26" y="72" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="26">From owning systems to</tspan><tspan x="26" dy="32">growing engineers</tspan></text><text x="26" y="142.2" font-size="15" fill="#334155"><tspan x="26">The next stage of my growth is multiplying impact</tspan><tspan x="26" dy="24">through others. I'm deliberately building the skills</tspan><tspan x="26" dy="24">of an engineering leader while staying close to the</tspan><tspan x="26" dy="24">code.</tspan></text><rect x="26" y="240.7" width="368" height="263.8" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="48" y="277.7" font-size="15.5" fill="#0F172A" font-weight="700"><tspan x="48">What I do today</tspan></text><g transform="translate(48 296.4) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="75" y="309.7" font-size="14" fill="#334155"><tspan x="75">Mentor engineers through pairing, design</tspan><tspan x="75" dy="21.5">feedback, and code reviews that teach</tspan></text><g transform="translate(48 346.1) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="75" y="359.4" font-size="14" fill="#334155"><tspan x="75">Lead system design reviews and drive</tspan><tspan x="75" dy="21.5">alignment on technical tradeoffs</tspan></text><g transform="translate(48 395.8) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="75" y="409.1" font-size="14" fill="#334155"><tspan x="75">Own operational readiness and incident</tspan><tspan x="75" dy="21.5">response for the services I build</tspan></text><g transform="translate(48 445.5) scale(0.7083)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.4l2.6 2.6 5-5.4"/></g><text x="75" y="458.8" font-size="14" fill="#334155"><tspan x="75">Partner with ML engineers on performance,</tspan><tspan x="75" dy="21.5">quality, and release confidence</tspan></text><rect x="26" y="520.5" width="368" height="214.1" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="48" y="557.5" font-size="15.5" fill="#0F172A" font-weight="700"><tspan x="48">What I'm building toward</tspan></text><g transform="translate(48 576.2) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="75" y="589.5" font-size="14" fill="#334155"><tspan x="75">Setting technical direction and a roadmap a</tspan><tspan x="75" dy="21.5">team can rally behind</tspan></text><g transform="translate(48 625.9) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="75" y="639.2" font-size="14" fill="#334155"><tspan x="75">Growing engineers into owners through</tspan><tspan x="75" dy="21.5">coaching and candid feedback</tspan></text><g transform="translate(48 675.6) scale(0.7083)" fill="none" stroke="#6366F1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.5 8.8l3.2 3.2-3.2 3.2"/></g><text x="75" y="688.9" font-size="14" fill="#334155"><tspan x="75">Building a culture of clarity, focus, and</tspan><tspan x="75" dy="21.5">shared credit</tspan></text>
</g>
</svg>
