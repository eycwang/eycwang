<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="Focus areas: Where I create the most leverage">
<title>Focus areas: Where I create the most leverage</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="880" height="540" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="880" height="540" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="880" height="540" fill="#FFFFFF"/>
<rect width="880" height="540" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="879" height="539" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="44" y="44" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="72" y="50" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="72">FOCUS AREAS</tspan></text><text x="44" y="90" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="44">Where I create the most leverage</tspan></text><rect x="44" y="119.2" width="388" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="66" y="141.2" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(75 150.2) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></g><text x="118" y="165.8" font-size="16" fill="#0F172A" font-weight="700"><tspan x="118">AI Platforms &amp; Evaluation</tspan></text><text x="66" y="209.2" font-size="14" fill="#475569"><tspan x="66">RAG pipelines, structured tool calling, and</tspan><tspan x="66" dy="22">multimodal evaluation with versioned datasets</tspan><tspan x="66" dy="22">and regression gates, so model changes ship with</tspan><tspan x="66" dy="22">evidence.</tspan></text><rect x="448" y="119.2" width="388" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="470" y="141.2" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(479 150.2) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12l-5.3 5.2M12 12l5.3 5.2"/></g><text x="522" y="165.8" font-size="16" fill="#0F172A" font-weight="700"><tspan x="522">Distributed Systems</tspan></text><text x="470" y="209.2" font-size="14" fill="#475569"><tspan x="470">Event-driven microservices on Kafka, gRPC, and</tspan><tspan x="470" dy="22">PostgreSQL, built with idempotent consumers,</tspan><tspan x="470" dy="22">safe retries, and end-to-end observability.</tspan></text><rect x="44" y="315.4" width="388" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="66" y="337.4" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(75 346.4) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 9v11"/></g><text x="118" y="362" font-size="16" fill="#0F172A" font-weight="700"><tspan x="118">Full-Stack Product Engineering</tspan></text><text x="66" y="405.4" font-size="14" fill="#475569"><tspan x="66">React and Next.js applications backed by Spring</tspan><tspan x="66" dy="22">Boot and FastAPI services, designed around the</tspan><tspan x="66" dy="22">real workflows of the people who use them.</tspan></text><rect x="448" y="315.4" width="388" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="470" y="337.4" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(479 346.4) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-13"/><path d="M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8"/></g><text x="522" y="362" font-size="16" fill="#0F172A" font-weight="700"><tspan x="522">Data Platforms</tspan></text><text x="470" y="405.4" font-size="14" fill="#475569"><tspan x="470">Incremental Spark and Glue pipelines,</tspan><tspan x="470" dy="22">dimensional models in Redshift, and automated</tspan><tspan x="470" dy="22">data-quality checks that catch issues before</tspan><tspan x="470" dy="22">stakeholders do.</tspan></text>
</g>
</svg>
