<svg xmlns="http://www.w3.org/2000/svg" width="880" height="282" viewBox="0 0 880 282" role="img" aria-label="Beyond work: Recharging in the Cascades">
<title>Beyond work: Recharging in the Cascades</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="880" height="282" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="880" height="282" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="880" height="282" fill="#FFFFFF"/>
<rect width="880" height="282" fill="url(#dots)" mask="url(#dotsMask)"/><circle cx="804" cy="146.3" r="16.52" fill="#DBEAFE"/><polygon points="500,282 572.2,215.92 625.4,247.78 693.8,164 754.6,223 796.4,191.14 880,254.86 880,282" fill="#E8EDFB"/><polygon points="693.8,164 674.53,187.6 681.64,183.47 688.86,188.78 697.6,182.88 707.1,188.19 718.12,187.6" fill="#FFFFFF"/><polygon points="576,282 652,237.16 701.4,261.94 762.2,208.84 815.4,246.6 857.2,227.72 880,239.52 880,282" fill="#D6E0F5"/>
</g>
<rect x="0.5" y="0.5" width="879" height="281" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="44" y="44" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="72" y="50" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="72">BEYOND WORK</tspan></text><text x="44" y="90" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="44">Recharging in the Cascades</tspan></text><text x="44" y="128.7" font-size="15.5" fill="#334155"><tspan x="44">Most weekends I'm on a trail somewhere in the Cascades.</tspan><tspan x="44" dy="26">Hiking is how I reset, and it reinforces the same lessons as</tspan><tspan x="44" dy="26">running production systems: prepare for conditions you don't</tspan><tspan x="44" dy="26">expect, pace yourself for the long climb, and know when to</tspan><tspan x="44" dy="26">turn back.</tspan></text>
</g>
</svg>
