<svg xmlns="http://www.w3.org/2000/svg" width="420" height="928" viewBox="0 0 420 928" role="img" aria-label="Focus areas: Where I create the most leverage">
<title>Focus areas: Where I create the most leverage</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="420" height="928" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="420" height="928" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="420" height="928" fill="#FFFFFF"/>
<rect width="420" height="928" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="927" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="26" y="26" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="54" y="32" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="54">FOCUS AREAS</tspan></text><text x="26" y="72" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="26">Where I create the most</tspan><tspan x="26" dy="32">leverage</tspan></text><rect x="26" y="133.2" width="368" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="48" y="155.2" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(57 164.2) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></g><text x="100" y="179.8" font-size="16" fill="#0F172A" font-weight="700"><tspan x="100">AI Platforms &amp; Evaluation</tspan></text><text x="48" y="223.2" font-size="14" fill="#475569"><tspan x="48">RAG pipelines, structured tool calling, and</tspan><tspan x="48" dy="22">multimodal evaluation with versioned datasets</tspan><tspan x="48" dy="22">and regression gates, so model changes ship</tspan><tspan x="48" dy="22">with evidence.</tspan></text><rect x="26" y="329.4" width="368" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="48" y="351.4" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(57 360.4) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M12 7.5V12M12 12l-5.3 5.2M12 12l5.3 5.2"/></g><text x="100" y="376" font-size="16" fill="#0F172A" font-weight="700"><tspan x="100">Distributed Systems</tspan></text><text x="48" y="419.4" font-size="14" fill="#475569"><tspan x="48">Event-driven microservices on Kafka, gRPC,</tspan><tspan x="48" dy="22">and PostgreSQL, built with idempotent</tspan><tspan x="48" dy="22">consumers, safe retries, and end-to-end</tspan><tspan x="48" dy="22">observability.</tspan></text><rect x="26" y="525.6" width="368" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="48" y="547.6" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(57 556.6) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18M9 9v11"/></g><text x="100" y="572.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="100">Full-Stack Product Engineering</tspan></text><text x="48" y="615.6" font-size="14" fill="#475569"><tspan x="48">React and Next.js applications backed by</tspan><tspan x="48" dy="22">Spring Boot and FastAPI services, designed</tspan><tspan x="48" dy="22">around the real workflows of the people who</tspan><tspan x="48" dy="22">use them.</tspan></text><rect x="26" y="721.8" width="368" height="180.2" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><rect x="48" y="743.8" width="38" height="38" rx="10" fill="#EFF6FF" stroke="#DBEAFE"/><g transform="translate(57 752.8) scale(0.8333)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="2.8"/><path d="M4.5 5.5v13c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8v-13"/><path d="M4.5 12c0 1.55 3.36 2.8 7.5 2.8s7.5-1.25 7.5-2.8"/></g><text x="100" y="768.4" font-size="16" fill="#0F172A" font-weight="700"><tspan x="100">Data Platforms</tspan></text><text x="48" y="811.8" font-size="14" fill="#475569"><tspan x="48">Incremental Spark and Glue pipelines,</tspan><tspan x="48" dy="22">dimensional models in Redshift, and</tspan><tspan x="48" dy="22">automated data-quality checks that catch</tspan><tspan x="48" dy="22">issues before stakeholders do.</tspan></text>
</g>
</svg>
