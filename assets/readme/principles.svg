<svg xmlns="http://www.w3.org/2000/svg" width="880" height="527" viewBox="0 0 880 527" role="img" aria-label="Principles: How I build">
<title>Principles: How I build</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="880" height="527" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="880" height="527" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="880" height="527" fill="#FFFFFF"/>
<rect width="880" height="527" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="879" height="526" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="44" y="44" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="72" y="50" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="72">PRINCIPLES</tspan></text><text x="44" y="90" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="44">How I build</tspan></text><rect x="44" y="119.2" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="64" y="151.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="64">01</tspan></text><line x1="90" y1="147.2" x2="110" y2="147.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="64" y="179.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="64">Own the outcome</tspan></text><text x="64" y="206" font-size="14" fill="#475569"><tspan x="64">Accountability continues past</tspan><tspan x="64" dy="21.5">the merge: rollout, monitoring,</tspan><tspan x="64" dy="21.5">and on-call.</tspan></text><rect x="313.33" y="119.2" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="333.33" y="151.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="333.33">02</tspan></text><line x1="359.33" y1="147.2" x2="379.33" y2="147.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="333.33" y="179.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="333.33">Design for failure</tspan></text><text x="333.33" y="206" font-size="14" fill="#475569"><tspan x="333.33">Expect duplicate messages,</tspan><tspan x="333.33" dy="21.5">slow dependencies, and partial</tspan><tspan x="333.33" dy="21.5">outages, then make them</tspan><tspan x="333.33" dy="21.5">uneventful.</tspan></text><rect x="582.67" y="119.2" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="602.67" y="151.2" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="602.67">03</tspan></text><line x1="628.67" y1="147.2" x2="648.67" y2="147.2" stroke="#BFDBFE" stroke-width="1.5"/><text x="602.67" y="179.2" font-size="16" fill="#0F172A" font-weight="700"><tspan x="602.67">Measure first</tspan></text><text x="602.67" y="206" font-size="14" fill="#475569"><tspan x="602.67">Traces, p95 latency, and error</tspan><tspan x="602.67" dy="21.5">budgets guide decisions, not</tspan><tspan x="602.67" dy="21.5">intuition.</tspan></text><rect x="44" y="308.7" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="64" y="340.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="64">04</tspan></text><line x1="90" y1="336.7" x2="110" y2="336.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="64" y="368.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="64">Ground AI in evidence</tspan></text><text x="64" y="395.5" font-size="14" fill="#475569"><tspan x="64">Retrieval with sources,</tspan><tspan x="64" dy="21.5">versioned datasets, and</tspan><tspan x="64" dy="21.5">regression evals before</tspan><tspan x="64" dy="21.5">anything ships.</tspan></text><rect x="313.33" y="308.7" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="333.33" y="340.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="333.33">05</tspan></text><line x1="359.33" y1="336.7" x2="379.33" y2="336.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="333.33" y="368.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="333.33">Earn complexity</tspan></text><text x="333.33" y="395.5" font-size="14" fill="#475569"><tspan x="333.33">Start with the simplest design</tspan><tspan x="333.33" dy="21.5">that works. Add complexity</tspan><tspan x="333.33" dy="21.5">only when the data demands it.</tspan></text><rect x="582.67" y="308.7" width="253.33" height="173.5" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/><text x="602.67" y="340.7" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="1" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace"><tspan x="602.67">06</tspan></text><line x1="628.67" y1="336.7" x2="648.67" y2="336.7" stroke="#BFDBFE" stroke-width="1.5"/><text x="602.67" y="368.7" font-size="16" fill="#0F172A" font-weight="700"><tspan x="602.67">Multiply the team</tspan></text><text x="602.67" y="395.5" font-size="14" fill="#475569"><tspan x="602.67">Clear docs, thoughtful reviews,</tspan><tspan x="602.67" dy="21.5">and mentoring are part of the</tspan><tspan x="602.67" dy="21.5">deliverable.</tspan></text>
</g>
</svg>
