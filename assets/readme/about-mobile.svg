<svg xmlns="http://www.w3.org/2000/svg" width="420" height="439" viewBox="0 0 420 439" role="img" aria-label="About: Engineering with ownership">
<title>About: Engineering with ownership</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#CBD5E1"/></pattern>
<radialGradient id="dotsFade" cx="1" cy="0" r="1.2"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0.3"/></radialGradient>
<mask id="dotsMask"><rect width="420" height="439" fill="url(#dotsFade)"/></mask>
<clipPath id="round"><rect width="420" height="439" rx="16"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="420" height="439" fill="#FFFFFF"/>
<rect width="420" height="439" fill="url(#dots)" mask="url(#dotsMask)"/>
</g>
<rect x="0.5" y="0.5" width="419" height="438" rx="15.5" fill="none" stroke="#E2E8F0"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<rect x="26" y="26" width="18" height="3" rx="1.5" fill="#2563EB"/><text x="54" y="32" font-size="12" fill="#2563EB" font-weight="700" letter-spacing="2"><tspan x="54">ABOUT</tspan></text><text x="26" y="72" font-size="24" fill="#0F172A" font-weight="700" letter-spacing="-0.2"><tspan x="26">Engineering with ownership</tspan></text><text x="26" y="110.2" font-size="15" fill="#334155"><tspan x="26">I'm a senior software engineer with 7+ years of</tspan><tspan x="26" dy="24">experience building full-stack products, distributed</tspan><tspan x="26" dy="24">backend services, and AI systems. My center of</tspan><tspan x="26" dy="24">gravity is the platform layer: event-driven services,</tspan><tspan x="26" dy="24">data pipelines, and the retrieval and evaluation</tspan><tspan x="26" dy="24">infrastructure that makes LLM-powered products</tspan><tspan x="26" dy="24">dependable.</tspan></text><text x="26" y="287.7" font-size="15" fill="#334155"><tspan x="26">I own work from design review through</tspan><tspan x="26" dy="24">production: shaping the architecture,</tspan><tspan x="26" dy="24">instrumenting it, and staying accountable for how</tspan><tspan x="26" dy="24">it behaves under real traffic. Today I focus on AI</tspan><tspan x="26" dy="24">governance tooling, systems that help teams</tspan><tspan x="26" dy="24">decide whether content is original, fair, and safe.</tspan></text>
</g>
</svg>
